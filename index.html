<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Mirror</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header p {
      color: #64748b;
      font-size: 17px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      display: none;
    }

    .issue {
      padding: 15px;
      margin: 12px 0;
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
    }

    .issue strong {
      display: block;
      margin-bottom: 5px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Agent Mirror</h1>
      <p>Test your website from a user's point of view.</p>
    </div>
